name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install supply-chain Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned supply-chain tools
        run: cargo +1.98.0 install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
      - name: Audit advisories
        run: cargo +1.98.0 audit
      - name: Check dependency policy
        run: cargo +1.98.0 deny check
