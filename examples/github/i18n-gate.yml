name: Native documentation translation check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "fani.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install fani
        run: cargo install --locked --path .
      - name: Validate native configuration and state
        run: fani doctor --config fani.toml
      - name: Check immutable-source translation plan
        run: fani check --config fani.toml
