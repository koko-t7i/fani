name: Native documentation translation check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "fani.ci.toml"

permissions:
  contents: read

env:
  FANI_VERSION: "0.3.0"
  FANI_TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned fani release
        run: |
          set -euo pipefail
          archive="fani-${FANI_TARGET}.tar.xz"
          base="https://github.com/koko-t7i/fani/releases/download/v${FANI_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSLO "${base}/${archive}.sha256"
          sha256sum --check "${archive}.sha256"
          tar -xJf "${archive}"
          install -Dm755 "fani-${FANI_TARGET}/fani" "$HOME/.local/bin/fani"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check immutable-source translation plan
        # `fani check` validates that the provider variable exists but performs
        # no model call, so these placeholders are not credentials.
        env:
          ANTHROPIC_API_KEY: check-only-placeholder
          OPENAI_API_KEY: check-only-placeholder
          XAI_API_KEY: check-only-placeholder
          DEEPSEEK_API_KEY: check-only-placeholder
        # Use a dedicated CI config with publish.source_ref = "HEAD" so the
        # checked-out pull-request merge commit, rather than origin/main, is planned.
        run: fani check --config fani.ci.toml
