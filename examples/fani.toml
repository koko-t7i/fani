# Complete annotated fani configuration. This is a production-oriented field
# reference, not the conservative starter generated by `fani init`. Review the
# repository path, globs, model, documentation commands, and publication flags
# before using it. Unknown fields are errors. Keep secrets out of this file.

[[repo]]
path = "~/code/product-docs"
languages = ["zh-CN", "ja"]

# Git blob paths at the fixed source revision. Always exclude the generated
# target root so merged translations cannot become sources in a later run.
include = ["docs/**/*.md", "README.md"]
exclude = ["i18n/**", "docs/archive/**", "CHANGELOG.md"]

# fani.db is the sole fani-owned state authority. Ignore .fani/ in Git.
data_dir = ".fani"

# Both tokens are required. {relpath} preserves the complete source path:
# docs/guide/start.md -> i18n/zh-CN/docs/guide/start.md
target_pattern = "i18n/{lang}/{relpath}"
max_tasks = 40
repair_budget = 2

[repo.quality]
revision = true
proofread = false

# Replace or remove project-specific commands that are not available in the
# runtime environment. Each command is an argv array, never a shell string.
# Commands run without Agent/provider credentials in fixed-source staging.
[repo.documentation]
commands = [
  ["mdbook", "build"],
]
timeout_s = 120

# Publication modes:
# enabled=false: materialize verified targets only.
# enabled=true, push=false: also prepare the stable local locale branch.
# enabled=true, push=true: update the configured remote branch.
[repo.publish]
enabled = true
source_ref = "origin/main"
branch = "i18n/{lang}"
push = false
remote = "origin"

# GitHub pull requests additionally require publish.enabled=true, push=true,
# a working `gh` login, and least-privilege repository credentials.
[repo.publish.github]
enabled = false
repository = "owner/product-docs"
base = "main"
draft = false
# Enforce required CI checks through GitHub branch protection on the base branch.

# Official providers need no script or provider CLI. Supported values are
# anthropic, openai, xai, and deepseek. Their fixed standard API-key environment
# variables are selected automatically and never stored here.
[agents.primary]
provider = "anthropic"
model = "claude-sonnet-4-5" # Example only; choose a model available to your account.
# OpenAI and OpenAI-compatible native agents may set one of: none, minimal,
# low, medium, high, or xhigh. The selected provider and model must support it.
# reasoning_effort = "medium"
concurrency = 4
timeout_s = 300
retries = 2
enabled = true
max_output_tokens = 8192

# A custom OpenAI-compatible service uses the native HTTPS adapter but requires
# a dedicated endpoint and credential variable:
# provider = "openai-compatible"
# endpoint = "https://models.example.com/v1/chat/completions"
# api_key_env = "FANI_EXAMPLE_API_KEY"
#
# Advanced private integrations can instead use the strict subprocess protocol:
# adapter = "command-json-v1"
# provider = "private"
# cmd = ["fani-provider"]
# env_allow = ["PRIVATE_PROVIDER_TOKEN"]

[routing]
translate = "primary"
repair = "primary"
revision = "primary"
proofread = "primary"
