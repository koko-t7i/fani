# fani 0.3 native Markdown configuration.
# Unknown fields are errors. Keep secrets out of this file.
# Diagnostics are environment-controlled: FANI_LOG=info uses human stderr;
# add FANI_LOG_FORMAT=json for newline-delimited JSON.

[[repo]]
path = "~/code/product-docs"
languages = ["zh-CN", "ja"]

# Git blob paths at the fixed source revision.
include = ["docs/**/*.md", "README.md"]
exclude = ["docs/archive/**", "CHANGELOG.md"]

# fani.db is the sole fani-owned state authority.
data_dir = ".fani"

# Both tokens are required. {relpath} is the source path.
target_pattern = "docs/{lang}/{relpath}"
max_tasks = 40
repair_budget = 2

[repo.quality]
revision = true
proofread = false

# Each documentation check is an argv array, never a shell string. Commands run
# without Agent/provider environment access in independent fixed-source staging.
[repo.documentation]
commands = [
  ["mdbook", "build"],
]
timeout_s = 120

[repo.publish]
enabled = true
source_ref = "origin/main"
branch = "i18n/{lang}"
push = false
remote = "origin"

[repo.publish.github]
enabled = false
repository = "owner/product-docs"
base = "main"
draft = false
required_checks = []

# Agents read one prompt from stdin and return translated text on stdout.
# Use {output_file} in argv for providers that write their final result to a file.
[agents.primary]
provider = "anthropic"
model = "claude-configured-default"
adapter = "command-json-v1"
cmd = ["claude", "-p", "--output-format", "text"]
concurrency = 4
timeout_s = 300
retries = 2
enabled = true
# Only named variables are copied into the isolated Agent environment.
env_allow = ["ANTHROPIC_API_KEY"]

[routing]
translate = "primary"
repair = "primary"
revision = "primary"
proofread = "primary"
