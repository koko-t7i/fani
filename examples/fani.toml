# fani 0.3 native Markdown configuration.
# Unknown fields are errors. Keep secrets out of this file.
# Diagnostics are environment-controlled: FANI_LOG=info uses human stderr;
# add FANI_LOG_FORMAT=json for newline-delimited JSON.

[[repo]]
path = "~/code/product-docs"
languages = ["zh-CN", "ja"]

# Git blob paths at the fixed source revision.
include = ["docs/**/*.md", "README.md"]
exclude = ["docs/archive/**", "CHANGELOG.md"]

# fani.db is the sole fani-owned state authority.
data_dir = ".fani"

# Both tokens are required. {relpath} is the source path.
target_pattern = "docs/{lang}/{relpath}"
max_tasks = 40
repair_budget = 2

[repo.quality]
revision = true
proofread = false

# Each documentation check is an argv array, never a shell string. Commands run
# without Agent/provider environment access in independent fixed-source staging.
[repo.documentation]
commands = [
  ["mdbook", "build"],
]
timeout_s = 120

[repo.publish]
enabled = true
source_ref = "origin/main"
branch = "i18n/{lang}"
push = false
remote = "origin"

[repo.publish.github]
enabled = false
repository = "owner/product-docs"
base = "main"
draft = false
required_checks = []

# Built-in providers need no script or provider CLI. Supported values are
# anthropic, openai, xai, deepseek, and openai-compatible. Standard API-key
# environment variables are selected automatically and never stored here.
[agents.primary]
provider = "anthropic"
model = "claude-sonnet-4-5"
concurrency = 4
timeout_s = 300
retries = 2
enabled = true
max_output_tokens = 8192

# For a custom OpenAI-compatible service, also set:
# provider = "openai-compatible"
# endpoint = "https://models.example.com/v1/chat/completions"
# api_key_env = "MODEL_API_KEY"
#
# Advanced private integrations can instead use the strict external protocol:
# adapter = "command-json-v1"
# cmd = ["fani-provider"]
# env_allow = ["PRIVATE_PROVIDER_TOKEN"]

[routing]
translate = "primary"
repair = "primary"
revision = "primary"
proofread = "primary"
